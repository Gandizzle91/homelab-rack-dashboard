<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Rack Dashboard</title>
<!-- Rack dashboard for a 1280x400 touch display. Settings: config.js -->
<style>
  :root{
    --bg:#090d12; --card:#10161e; --card2:#141c26; --line:#1f2a36; --land:#1b2531; --landline:#0d1218;
    --text:#dce6f0; --muted:#7f8c9b; --dim:#4f5b68;
    --red:#ff4d5e; --green:#3ddc84; --amber:#ffb547; --orange:#ff8a3d; --blue:#4cc2ff; --violet:#a78bfa;
    --mono:"JetBrains Mono","DejaVu Sans Mono","Liberation Mono",monospace;
    --sans:"Inter","Noto Sans","DejaVu Sans","Liberation Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent;user-select:none}
  /* mouse pointer only visible while a mouse/touchpad is moving */
  html:not(.mouse), html:not(.mouse) *{cursor:none !important}
  html.mouse .tap, html.mouse button{cursor:pointer}
  #app{width:1280px;height:400px;display:flex;flex-direction:column;transform-origin:0 0;position:relative}
  #app::after{content:"";position:absolute;inset:0;border:5px solid transparent;pointer-events:none;z-index:5}
  #app.warn::after{border-color:var(--orange);box-shadow:inset 0 0 24px rgba(255,138,61,.35)}
  #app.crit::after{border-color:var(--red);box-shadow:inset 0 0 30px rgba(255,77,94,.5);animation:alarm 1.4s ease-in-out infinite}
  #app.warn header{background:#22160d}
  #app.crit header{background:#2b0f15}
  @keyframes alarm{50%{opacity:.4}}
  .alert{display:none;font-size:12px;font-weight:700;padding:2px 9px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}
  #app.warn .alert{display:block;background:rgba(255,138,61,.16);color:var(--orange)}
  #app.crit .alert{display:block;background:rgba(255,77,94,.22);color:#ffa0a9}
  .cs{font-size:12px;color:var(--muted);margin:-2px 0 5px}
  .top.reasons{margin:0 0 2px}
  .cs b{color:var(--text);font-weight:700}
  .lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .num{font-variant-numeric:tabular-nums}

  header{height:32px;display:flex;align-items:center;gap:18px;padding:0 14px;border-bottom:1px solid var(--line);background:#0b1016}
  .brand{font-weight:800;letter-spacing:.22em;font-size:13px}
  .clock{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .pills{margin-left:auto;display:flex;gap:14px;align-items:center}
  .pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .pill.tap{padding:8px 0;margin:-8px 0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  .dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
  .dot.bad{background:var(--red);box-shadow:0 0 6px var(--red)}
  .dot.warn{background:var(--orange);box-shadow:0 0 6px var(--orange)}
  .dot.live{animation:blink 2s infinite}
  @keyframes blink{50%{opacity:.35}}

  main{height:367px;display:grid;grid-template-columns:490px 420px 1fr;grid-template-rows:minmax(0,1fr);gap:10px;padding:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:5px;line-height:16px}
  .big{font-size:20px;font-weight:700}
  /* tappable tiles */
  .tap{transition:border-color .15s,background-color .15s}
  .card.tap:active, .pill.tap:active{border-color:var(--blue);background-color:#131d29}
  .go{color:var(--dim);font-size:16px;font-weight:700;margin-left:7px;letter-spacing:0;line-height:0}

  /* map */
  #map{display:block;margin:auto}
  #land{fill:var(--land);stroke:var(--landline);stroke-width:.6}
  .hit{fill:rgba(255,77,94,.42);stroke:var(--red);stroke-width:1}
  .pulse{fill:none;stroke:var(--red);stroke-width:2;animation:pulse 1.8s ease-out forwards}
  .core{fill:#fff;animation:fade 1.8s ease-out forwards}
  @keyframes pulse{from{r:2;opacity:1}to{r:22;opacity:0}}
  @keyframes fade{from{opacity:1}to{opacity:0}}
  .top{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
  .chip{font-size:12px;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .chip b{color:var(--red);margin-right:5px;font-weight:700}
  .chip.r{color:var(--muted)} .chip.r b{color:var(--amber)}

  /* Log */
  #log{display:flex;flex-direction:column;gap:1px;font-family:var(--mono);font-size:13px}
  .row{display:grid;grid-template-columns:64px 30px 124px 1fr;gap:9px;align-items:center;height:22.5px;padding:0 6px;border-radius:4px;border-left:2px solid transparent}
  .row.new{animation:slide .5s ease-out, flash 3s ease-out;border-left-color:var(--red)}
  @keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes flash{from{background:rgba(255,77,94,.16)}to{background:transparent}}
  .t{color:var(--muted)}
  .cc{font-size:11px;font-weight:700;text-align:center;border-radius:3px;background:rgba(255,77,94,.15);color:#ff8f9a;padding:1px 0;font-family:var(--mono)}
  .cc.none{background:var(--card2);color:var(--dim)}
  .ip{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .port{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .port b{color:var(--amber);font-weight:600}

  /* right column */
  .stack{display:grid;grid-template-rows:96px 96px minmax(0,1fr);gap:10px;min-height:0}
  .wan{display:flex;gap:16px;align-items:baseline;font-weight:700;font-size:17px}
  .wan .d{color:var(--green)} .wan .u{color:var(--amber)}
  .wan small{font-size:11px;color:var(--muted);font-weight:500;margin-left:3px}
  #spark{display:block;margin-top:4px}
  .bars{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:16px}
  .bar{display:grid;grid-template-columns:84px 1fr 46px;gap:8px;align-items:center}
  .bar.sys{grid-template-columns:54px 1fr 34px 1fr 34px 40px}
  .bar.drv{grid-template-columns:8px 74px 1fr 40px 34px;gap:7px;white-space:nowrap}
  .drives{gap:3px}
  .track{height:7px;background:var(--card2);border-radius:4px;overflow:hidden}
  .fill{height:100%;width:0;border-radius:4px;background:var(--green);transition:width .8s ease,background .8s}
  .v{text-align:right;color:var(--text)}
  .k{color:var(--muted)}

  /* ===================== detail pages ===================== */
  #detail{height:368px;padding:8px 10px 10px;display:none;flex-direction:column;gap:8px}
  #app[data-view="detail"] main{display:none}
  #app[data-view="detail"] #detail{display:flex}
  .dbar{height:42px;display:flex;align-items:center;gap:16px;flex:none}
  .back{height:42px;padding:0 20px 0 14px;border-radius:9px;background:var(--card2);border:1px solid #2a3846;color:var(--text);font:700 14px var(--sans);display:flex;align-items:center;gap:8px;flex:none}
  .back:active{background:#1d2935;border-color:var(--blue)}
  .back span{font-size:24px;line-height:0;margin-top:-3px;color:var(--blue)}
  .dtitle{font-size:16px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
  .dsub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .dright{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
  .ranges{display:flex;gap:6px}
  .rng{height:42px;min-width:76px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 13px var(--sans)}
  .rng.on{background:var(--card2);color:var(--text);border-color:#33475a}
  .rng:active{border-color:var(--blue)}
  .dauto{font:11px var(--mono);color:var(--dim);width:118px;text-align:right}
  .dbody{flex:1;min-height:0;display:grid;gap:10px;grid-template-rows:minmax(0,1fr);transition:opacity .2s}
  .dbody.busy{opacity:.55}
  .dbody.attacks{grid-template-columns:400px 1fr 350px}
  .dbody.firewall{grid-template-columns:1fr 1fr 340px}
  .dbody.wan{grid-template-columns:1fr 330px}
  .dbody.systems{grid-template-columns:1fr}
  .dbody.drives{grid-template-columns:470px 1fr}
  .dbody.backups{grid-template-columns:1fr 330px}
  .loading{grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
  .scroll{overflow-y:auto;scrollbar-width:none;min-height:0}
  .scroll::-webkit-scrollbar{display:none}

  .list{display:flex;flex-direction:column;gap:3px;font-size:13px}
  .li{display:grid;align-items:center;gap:9px;height:21px;white-space:nowrap}
  .li .n{overflow:hidden;text-overflow:ellipsis}
  .li .c{text-align:right;font-variant-numeric:tabular-nums}
  .li .p{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .li .m{color:var(--muted)}
  .li b{color:var(--amber);font-weight:600}
  .mini{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
  .mini i{display:block;height:100%;border-radius:3px}
  .sec{margin:10px 0 5px}
  .kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px;line-height:17px}
  .kv span:nth-child(odd){color:var(--muted)}
  .kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
  .stats{display:flex;gap:24px;margin-top:8px}
  .stat{display:flex;flex-direction:column;line-height:1.15}
  .stat b{font-size:18px;font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap}
  .leg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);white-space:nowrap;letter-spacing:0;text-transform:none}
  .leg i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .ch{display:block}
  .ax line{stroke:var(--line);stroke-width:1}
  .ax line.vt{stroke:#161f29}
  .ax text{fill:var(--dim);font:10px var(--sans)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:0 7px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:0 7px;height:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tbl tr+tr td{border-top:1px solid #18212b}
  .tbl .r{text-align:right}
  .tbl tr.dim td{color:var(--dim)}
  .tbl td.s{color:var(--muted);font-size:12px}
  .tbl.tall td{height:43px}
  .sub2{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  .ok{color:var(--green)} .bad{color:var(--red)} .wrn{color:var(--orange)} .mut{color:var(--muted)}
  .note{font-size:11px;color:var(--dim);margin-top:auto;padding-top:4px}
  /* systems page */
  .sysg{display:grid;grid-template-columns:232px 1fr 1fr 1fr 124px;column-gap:16px;align-items:center}
  .sysg.h{padding:0 2px 5px;border-bottom:1px solid var(--line)}
  .sysg.r{height:62px;padding:0 2px}
  .sysg.r.five{height:50px}
  .sysg.r+.sysg.r{border-top:1px solid #18212b}
  .sname{display:flex;flex-direction:column;gap:1px;min-width:0}
  .sname b{font-size:14.5px;display:flex;align-items:center;gap:7px}
  .sname span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scell{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;min-width:0}
  .sv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  .ss{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .sx{font-size:12.5px;line-height:19px;font-variant-numeric:tabular-nums}
  .sx span{color:var(--muted)}

  /* ===================== security (vulnscan) ===================== */
  .mid{display:grid;grid-template-rows:minmax(0,1fr) 80px;gap:10px;min-height:0}
  .vst{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .vrow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.15fr;gap:10px;margin-top:1px}
  .vs{display:flex;flex-direction:column;line-height:1.12;min-width:0}
  .vs b{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .vs span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dbody.security{grid-template-columns:1fr 318px 318px}
  .tbl.vt td{height:24px}
  .sevs{display:flex;gap:20px;margin:2px 0 6px}
  .sevs .stat b{font-size:22px}
  .sv-c{font-size:10.5px;font-weight:800;border-radius:3px;padding:1px 5px;text-transform:uppercase;letter-spacing:.04em}
  .act{height:52px;width:100%;border-radius:10px;border:1px solid #2a3846;background:var(--card2);color:var(--text);font:700 15px var(--sans);display:flex;align-items:center;justify-content:center;gap:10px;flex:none}
  .act:active{border-color:var(--blue);background:#1d2935}
  .act.pr{background:#33181d;border-color:#6b2a33;color:#ffd5da}
  .act.pr:active{background:#45202a;border-color:var(--red)}
  .act:disabled{opacity:.38}
  .act .ic{font-size:20px;line-height:0}
  .act .cnt{font-size:12px;background:rgba(255,77,94,.25);color:#ffb3bb;border-radius:9px;padding:1px 7px}
  .acts{display:flex;flex-direction:column;gap:8px}
  .jhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 5px}
  .steps{display:flex;flex-direction:column;gap:3px;font-size:13px}
  .stp{display:grid;grid-template-columns:18px 1fr auto;gap:7px;align-items:center;height:19px}
  .stp i{font-style:normal;text-align:center;font-weight:800}
  .stp .t2{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
  .stp.s-run i{color:var(--blue);animation:blink 1.2s infinite}
  .stp.s-ok i{color:var(--green)} .stp.s-fail i{color:var(--red)} .stp.s-fail{color:#ffb3bb} .stp.s-wait, .stp.s-skip{color:var(--dim)}
  .jres{font-size:12.5px;margin-top:6px;line-height:16px}
  .vlog{font:10.5px/13px var(--mono);color:var(--dim);white-space:pre;overflow:hidden;margin-top:auto;padding-top:5px}

  /* confirmation dialog */
  #modal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(4,7,11,.86)}
  #modal.on{display:flex}
  .dlg{width:1256px;height:384px;background:#0e141c;border:1px solid #2f3f50;border-radius:12px;display:flex;flex-direction:column;padding:11px 14px 11px;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .dlh{display:flex;align-items:center;gap:14px}
  .dlh h2{font-size:16px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
  .dlh .ds{font-size:12px;color:var(--muted);flex:1;min-width:0;line-height:15px}
  .sm{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 13px var(--sans);flex:none}
  .sm:active{border-color:var(--blue);color:var(--text)}
  .plist{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#33475a transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .ph{display:grid;grid-template-columns:40px 200px 112px 1fr;gap:12px;align-items:center;padding:6px 6px 6px 2px;min-height:46px}
  .ph+.ph{border-top:1px solid #18212b}
  .ph:active{background:#121a24}
  .ph .pn{display:flex;flex-direction:column;min-width:0}
  .ph .pn b{font-size:14.5px}
  .ph .pn span, .ph .pc span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph .pc{font-size:13px;line-height:16px}
  .ph .pc span.wrn{color:var(--orange)}
  .plist.more{-webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent);mask-image:linear-gradient(to bottom,#000 78%,transparent)}
  .ph .pk{font:11.5px/16px var(--mono);color:#9fb0c2;word-break:break-word}
  .ph .pk .wrn{font-family:var(--sans)}
  .ph:not(.on) .pk, .ph:not(.on) .pn b{color:var(--dim)}
  .cb{width:30px;height:30px;border-radius:7px;border:2px solid #3a4a5c;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:transparent;flex:none;margin-left:4px}
  .on>.cb{background:var(--blue);border-color:var(--blue);color:#06121c}
  .dfoot{display:flex;align-items:center;gap:12px;flex:none}
  .conf{display:flex;align-items:center;gap:11px;height:52px;padding:0 16px 0 8px;border-radius:10px;border:1px solid #2a3846;background:var(--card2);font-size:14px;font-weight:600;flex:none}
  .conf.on{border-color:var(--orange);background:#241a10}
  .conf.on>.cb{background:var(--orange);border-color:var(--orange)}
  .dsum{flex:1;min-width:0;font-size:12.5px;color:var(--muted);line-height:16px}
  .dsum b{color:var(--text)}
  .dsum .err{color:var(--red);font-weight:700}
  .dfoot .act{width:auto;padding:0 24px}
  /* optional parts switched off in config.js */
  #app.no-vuln .mid{grid-template-rows:minmax(0,1fr)}
  #app.no-vuln #vcard{display:none}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand tap" id="brand"></div>
  <div class="clock num" id="clock">--:--:--</div>
  <div class="alert tap" id="alert"></div>
  <div class="pills" id="pills"><!-- filled from config.js --></div>
</header>

<main>
  <section class="card tap" data-detail="attacks">
    <div class="head"><span class="lbl"><span data-t="Blocked · 24 h"></span><i class="go">›</i></span><span class="big num" id="total">–</span></div>
    <div class="cs" id="cs">CrowdSec –</div>
    <div class="top reasons" id="reasons"></div>
    <svg id="map" width="444" height="220" viewBox="0 0 466 250">
      <path id="land"></path>
      <g id="hits"></g>
      <g id="pulses"></g>
    </svg>
    <div class="top" id="top"></div>
  </section>

  <div class="mid">
  <section class="card tap" data-detail="firewall">
    <div class="head"><span class="lbl"><span data-t="Firewall · WAN · live"></span><i class="go">›</i></span><span class="lbl num" id="rate">–</span></div>
    <div id="log"></div>
  </section>
  <section class="card tap" data-detail="security" id="vcard">
    <div class="head"><span class="lbl"><span data-t="Security"></span><i class="go">›</i></span><span class="vst" id="v-state" style="color:var(--dim)"><span class="dot"></span>–</span></div>
    <div class="vrow" id="v-stats"><div class="vs"><b style="color:var(--dim)">–</b><span data-t="loading …"></span></div></div>
  </section>
  </div>

  <div class="stack">
    <section class="card tap" data-detail="wan">
      <div class="head"><span class="lbl">WAN<i class="go">›</i></span><span class="lbl">30 min</span></div>
      <div class="wan num"><span class="d" id="down">↓ –</span><span class="u" id="up">↑ –</span></div>
      <svg id="spark" width="306" height="32" viewBox="0 0 306 32" preserveAspectRatio="none">
        <path id="sp-d-area" fill="rgba(61,220,132,.14)"></path>
        <path id="sp-d" fill="none" stroke="#3ddc84" stroke-width="1.5"></path>
        <path id="sp-u" fill="none" stroke="#ffb547" stroke-width="1.2"></path>
      </svg>
    </section>
    <section class="card tap" data-detail="systems">
      <div class="head"><span class="lbl"><span data-t="Systems"></span><i class="go">›</i></span><span class="lbl" data-t="CPU · RAM · Temp"></span></div>
      <div class="bars" id="sys"></div>
    </section>
    <section class="card tap" data-detail="drives">
      <div class="head"><span class="lbl"><span data-t="Drives"></span><i class="go">›</i></span><span class="lbl" data-t="Temp · Wear"></span></div>
      <div class="bars drives" id="drives"></div>
    </section>
  </div>
</main>

<div id="detail">
  <div class="dbar">
    <button class="back" id="back"><span>‹</span><span data-t="Overview"></span></button>
    <div style="min-width:0;flex:1"><div class="dtitle" id="dtitle"></div><div class="dsub" id="dsub"></div></div>
    <div class="dright">
