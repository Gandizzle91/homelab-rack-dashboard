# Serves the panel and a read-only proxy to Prometheus and Loki in the monitoring network.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=30s ipv6=off;   # Docker DNS, so nginx starts even if Loki is still down

  location / {
    add_header Cache-Control "no-store";
    index index.html;
    try_files $uri /index.html =404;
  }

  # read-only access to Prometheus (no admin API, no POST)
  location /prom/ {
    limit_except GET { deny all; }
    set $up_prom http://prometheus:9090;
    rewrite ^/prom/(.*)$ /$1 break;
    proxy_pass $up_prom;
  }

  # read-only access to Loki
  location /loki/ {
    limit_except GET { deny all; }
    set $up_loki http://loki:3100;
    rewrite ^/loki/(.*)$ /$1 break;
    proxy_pass $up_loki;
  }
}
