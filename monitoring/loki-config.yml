# Single-node Loki with local storage. 14 days of firewall logs need only a few GB.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true      # Alloy stores the parsed filterlog fields as structured metadata
  retention_period: 14d
  max_entries_limit_per_query: 5000    # the "Firewall" page analyses up to 5000 entries (fwSample)
  max_query_series: 1000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
